<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Focus Studio — اختبار أساسيات التصوير</title>
  <meta name="description" content="اختبار تفاعلي لأساسيات التصوير الفوتوغرافي من Focus Studio Marketing Agency">
  <meta name="theme-color" content="#09090d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Focus Quiz">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- خلفية ضبابية متحركة -->
  <div class="bg" aria-hidden="true">
    <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="grain"></i>
  </div>

  <!-- شاشة الافتتاح: الشعار المتحرك -->
  <div id="splash" class="splash" role="presentation" aria-label="Focus Studio">
    <div class="splash-inner" id="splashInner"></div>
    <button class="skip" id="skipSplash" type="button">تخطي</button>
  </div>

  <div id="app"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><p style="color:#fff;text-align:center;padding:2rem">يلزم تفعيل JavaScript لتشغيل التطبيق.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
