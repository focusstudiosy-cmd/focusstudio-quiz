<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Focus Studio — اختبار أساسيات التصوير</title>
  <meta name="description" content="اختبار تفاعلي لأساسيات التصوير الفوتوغرافي من Focus Studio Marketing Agency">
  <meta name="theme-color" content="#09090d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Focus Quiz">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
/* ───────────── Focus Studio · Quiz PWA ───────────── */
:root{
  --red:#ba070b; --red-2:#e11d24; --red-glow:rgba(225,29,36,.45);
  --bg:#09090d; --text:#f6f6f8; --muted:rgba(255,255,255,.64); --faint:rgba(255,255,255,.4);
  --glass-1:rgba(255,255,255,.10); --glass-2:rgba(255,255,255,.035);
  --line:rgba(255,255,255,.14); --ok:#34d399; --bad:#f87171; --gold:#f5c451;
  --r:22px; --font:"Cairo","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.7;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
::selection{background:var(--red);color:#fff}

/* ── الخلفية الضبابية ── */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
  radial-gradient(1200px 700px at 80% -10%,#1a0a0d 0%,transparent 60%),
  radial-gradient(900px 600px at 0% 110%,#12090c 0%,transparent 60%),var(--bg)}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
.o1{width:46vmax;height:46vmax;background:radial-gradient(circle,var(--red) 0%,transparent 68%);top:-18vmax;right:-14vmax;animation:drift1 22s ease-in-out infinite alternate}
.o2{width:38vmax;height:38vmax;background:radial-gradient(circle,#7a0509 0%,transparent 68%);bottom:-16vmax;left:-12vmax;animation:drift2 26s ease-in-out infinite alternate}
.o3{width:24vmax;height:24vmax;background:radial-gradient(circle,rgba(255,255,255,.16) 0%,transparent 70%);top:38%;left:30%;opacity:.35;animation:drift3 30s ease-in-out infinite alternate}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes drift1{to{transform:translate(-12vmax,10vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(14vmax,-8vmax) scale(1.2)}}
@keyframes drift3{to{transform:translate(-10vmax,-12vmax) scale(.8)}}

/* ── الزجاج ── */
.glass{
  background:linear-gradient(135deg,var(--glass-1),var(--glass-2));
  -webkit-backdrop-filter:blur(26px) saturate(165%);backdrop-filter:blur(26px) saturate(165%);
  border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 24px 60px -12px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.02);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(24,24,30,.92)}}

/* ── التخطيط ── */
.wrap{width:100%;max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
.wrap.wide{max-width:1160px}
.wrap.center{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.fade-in{animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ── الشعار ── */
.brand{display:flex;align-items:center;justify-content:center;gap:14px;direction:ltr}
.brand .mark{width:64px;height:auto;flex:none;filter:drop-shadow(0 6px 18px rgba(186,7,11,.45))}
.brand .wordmark{height:46px;width:auto;display:block}
.brand.sm .mark{width:38px}.brand.sm .wordmark{height:28px}
.mark .arc,.mark .tick{transform-box:view-box}

/* حركة الشعار: الدائرة تدور وتظهر ← الصح يُكتب ← النقطة تومض أحمر/أبيض وتثبت */
.mark.anim .spin{transform-origin:428px 488px;transform-box:view-box;animation:spinIn 1.7s cubic-bezier(.22,.8,.25,1) both}
.mark.anim .arc{stroke-dasharray:1560;stroke-dashoffset:1560;animation:drawArc 1.7s cubic-bezier(.22,.8,.25,1) forwards}
.mark.anim .tick{stroke-dasharray:790;stroke-dashoffset:790;animation:drawTick .95s cubic-bezier(.5,.1,.3,1) 1.75s forwards}
.mark.anim .dot{opacity:0;transform-box:fill-box;transform-origin:center;animation:blinkDot 1.5s ease-in-out 2.75s forwards}
@keyframes spinIn{from{transform:rotate(380deg)}to{transform:rotate(0)}}
@keyframes drawArc{to{stroke-dashoffset:0}}
@keyframes drawTick{to{stroke-dashoffset:0}}
@keyframes blinkDot{
  0%{opacity:0;fill:#ba070b;transform:scale(.2)}
  14%{opacity:1;fill:#ba070b;transform:scale(1.3)}
  28%{fill:#fff;transform:scale(1)}
  44%{fill:#ba070b}
  60%{fill:#fff}
  78%{fill:#ba070b}
  100%{opacity:1;fill:#fff;transform:scale(1)}
}

/* ── شاشة الافتتاح ── */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(9,9,13,.55);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);transition:opacity .7s ease,visibility .7s}
.splash.out{opacity:0;visibility:hidden}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:22px;direction:ltr}
.splash .mark{width:min(46vw,210px);height:auto;filter:drop-shadow(0 10px 40px rgba(186,7,11,.5))}
.splash .wordmark{width:min(70vw,300px);opacity:0;transform:translateY(10px);animation:fadeUp .9s ease 3s forwards}
.skip{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));font-size:.8rem;color:var(--faint);padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04)}

/* ── نصوص ── */
h1{font-size:1.55rem;font-weight:800;line-height:1.35}
h2{font-size:1.25rem;font-weight:700;line-height:1.55}
h3{font-size:1.08rem;font-weight:700}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:.84rem}.tc{text-align:center}
.red{color:var(--red-2)}

/* ── البطاقات والحقول ── */
.card{padding:26px 22px}
.card>h1+.muted{margin-top:2px;margin-bottom:20px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:.88rem;font-weight:600;margin-bottom:6px;color:rgba(255,255,255,.82)}
.input,.select,.textarea{width:100%;padding:13px 15px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);outline:none;transition:border-color .2s,box-shadow .2s,background .2s;font-size:1rem}
.input::placeholder,.textarea::placeholder{color:rgba(255,255,255,.3)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--red-2);box-shadow:0 0 0 4px rgba(225,29,36,.22);background:rgba(0,0,0,.4)}
.input.ltr{direction:ltr;text-align:right}
.select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'><path d='M1 1l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 14px center;padding-left:38px}
.select option{background:#17171d;color:#fff}
.textarea{min-height:92px;resize:vertical}
.err{min-height:1.4em;color:#ff8f94;font-size:.88rem;margin:2px 0 10px}

/* ── الأزرار ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:14px;font-weight:700;font-size:1rem;transition:transform .15s,box-shadow .25s,background .25s,opacity .2s;border:1px solid var(--line);background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn:hover{background:rgba(255,255,255,.12)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.primary{background:linear-gradient(135deg,var(--red-2),var(--red));border-color:rgba(255,255,255,.22);box-shadow:0 10px 30px -8px var(--red-glow),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.primary:hover{box-shadow:0 14px 38px -6px var(--red-glow),inset 0 1px 0 rgba(255,255,255,.35);filter:brightness(1.08)}
.btn.danger{color:#ffb4b7;border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}
.btn.danger:hover{background:rgba(248,113,113,.18)}
.btn.block{width:100%}.btn.sm{padding:8px 14px;font-size:.86rem;border-radius:11px}
.icon-btn{width:36px;height:36px;border-radius:11px;display:inline-grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:.95rem;transition:background .2s}
.icon-btn:hover{background:rgba(255,255,255,.14)}
.link{color:var(--muted);text-decoration:underline;text-underline-offset:4px;font-size:.88rem}

/* ── شارات ── */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;font-size:.78rem;font-weight:700;border:1px solid var(--line);background:rgba(255,255,255,.07);color:rgba(255,255,255,.85);white-space:nowrap}
.lvl-1{color:#86efac;border-color:rgba(134,239,172,.35);background:rgba(52,211,153,.1)}
.lvl-2{color:#7dd3fc;border-color:rgba(125,211,252,.35);background:rgba(56,189,248,.1)}
.lvl-3{color:#fcd34d;border-color:rgba(252,211,77,.35);background:rgba(245,196,81,.1)}
.lvl-4{color:#ff9a9e;border-color:rgba(255,120,125,.4);background:rgba(225,29,36,.14)}
.g-pro{color:#ffd978;border-color:rgba(245,196,81,.5);background:rgba(245,196,81,.14)}
.g-good{color:#86efac;border-color:rgba(134,239,172,.4);background:rgba(52,211,153,.12)}
.g-mid{color:#7dd3fc;border-color:rgba(125,211,252,.4);background:rgba(56,189,248,.12)}
.g-phone{color:#fcd34d;border-color:rgba(252,211,77,.4);background:rgba(251,191,36,.1)}
.g-fail{color:#ff9a9e;border-color:rgba(255,120,125,.45);background:rgba(225,29,36,.16)}

/* ── المقدمة ── */
.rules{list-style:none;display:grid;gap:10px;margin:16px 0 22px}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:.95rem;color:rgba(255,255,255,.86)}
.rules li b{flex:none;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:rgba(225,29,36,.2);border:1px solid rgba(225,29,36,.4);font-size:.78rem}
.who{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px}

/* ── الاختبار ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:18px;margin-bottom:12px}
.counter{font-weight:800;font-size:1.02rem;letter-spacing:.5px}.counter small{font-weight:600;color:var(--muted)}
.progress{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red-2));border-radius:99px;box-shadow:0 0 14px var(--red-glow);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.dots{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;margin-bottom:6px}
.dots::-webkit-scrollbar{display:none}
.dot-b{flex:none;width:32px;height:32px;border-radius:10px;font-size:.78rem;font-weight:700;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);transition:all .2s}
.dot-b.done{background:rgba(225,29,36,.22);border-color:rgba(225,29,36,.5);color:#fff}
.dot-b.cur{background:var(--red);border-color:#fff;color:#fff;transform:scale(1.1);box-shadow:0 0 16px var(--red-glow)}
.qcard{padding:24px 20px;margin-bottom:14px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.qtext{font-size:1.2rem;line-height:1.85;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:14px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.05);transition:all .2s;font-size:1rem;line-height:1.6}
.opt:hover{background:rgba(255,255,255,.1);transform:translateX(-2px)}
.opt .k{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.9rem;background:rgba(255,255,255,.08);border:1px solid var(--line);transition:all .2s}
.opt.sel{background:linear-gradient(135deg,rgba(225,29,36,.3),rgba(186,7,11,.14));border-color:rgba(255,90,96,.65);box-shadow:0 8px 26px -10px var(--red-glow)}
.opt.sel .k{background:var(--red);border-color:#fff;color:#fff}
.hint{margin-top:8px;font-size:.82rem;color:var(--faint)}
.navbtns{display:flex;gap:10px}.navbtns .btn{flex:1}

/* ── النتيجة ── */
.result{padding:30px 20px;text-align:center}
.ring{position:relative;width:200px;height:200px;margin:4px auto 14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .trk{stroke:rgba(255,255,255,.1)}
.ring .bar{stroke:url(#rg);stroke-linecap:round;stroke-dasharray:314;stroke-dashoffset:314;transition:stroke-dashoffset 1.8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px var(--red-glow))}
.ring .num{position:absolute;inset:0;display:grid;place-content:center;font-size:2.7rem;font-weight:800;line-height:1}
.ring .num small{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-top:6px}
.gradebadge{display:inline-block;padding:6px 26px;border-radius:99px;font-size:1.3rem;font-weight:800;border:1px solid;margin:2px 0 10px}
.legend{display:grid;gap:6px;margin:20px auto 6px;max-width:340px;text-align:right}
.legend div{display:flex;justify-content:space-between;gap:10px;padding:7px 14px;border-radius:12px;font-size:.88rem;color:var(--muted);border:1px solid transparent}
.legend div.me{color:#fff;background:rgba(255,255,255,.1);border-color:var(--line);font-weight:700}
.review{display:grid;gap:12px;margin-top:16px}
.rv{padding:16px;border-radius:18px;text-align:right}
.rv.ok{border-color:rgba(52,211,153,.4)}.rv.no{border-color:rgba(248,113,113,.4)}
.rv-h{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.rv-h .n{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:rgba(255,255,255,.08)}
.rv.ok .n{background:rgba(52,211,153,.25);color:#86efac}.rv.no .n{background:rgba(248,113,113,.25);color:#ffb4b7}
.rv p{font-size:.92rem;margin-top:4px}
.rv .a-you{color:#ffb4b7}.rv.ok .a-you{color:#86efac}.rv .a-ok{color:#86efac}
.rv .why{margin-top:8px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-size:.84rem;color:var(--muted)}

/* ── الأدمن ── */
.adm-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap}
.adm-head .r{display:flex;gap:8px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:16px 18px}
.stat b{display:block;font-size:1.8rem;font-weight:800;line-height:1.2}
.stat span{color:var(--muted);font-size:.84rem}
.tabs{display:flex;gap:6px;padding:6px;margin-bottom:16px;width:fit-content;max-width:100%;overflow-x:auto}
.tab{padding:9px 20px;border-radius:15px;font-weight:700;color:var(--muted);white-space:nowrap;transition:all .2s}
.tab.on{background:linear-gradient(135deg,var(--red-2),var(--red));color:#fff;box-shadow:0 6px 20px -6px var(--red-glow)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .input,.toolbar .select{width:auto;flex:1;min-width:150px;padding:10px 14px}
.tbl-wrap{overflow:hidden;padding:6px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font-size:.78rem;color:var(--faint);font-weight:700;text-align:right;padding:12px 12px}
td{padding:12px;border-top:1px solid rgba(255,255,255,.07);vertical-align:middle}
td.ltr{direction:ltr;text-align:right}
tr:hover td{background:rgba(255,255,255,.03)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.score{font-weight:800;font-size:1.02rem}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.qrow{padding:16px 18px;display:grid;gap:8px}
.qrow-h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.qrow-h .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qrow .qt{font-weight:600;line-height:1.7}
.qrow .ans{font-size:.86rem;color:#86efac}
.qlist{display:grid;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 16px;border-radius:99px;font-size:.84rem;font-weight:700;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted)}
.chip.on{background:rgba(225,29,36,.25);border-color:rgba(255,90,96,.6);color:#fff}
.set-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.set-grid .card h3{margin-bottom:6px}.set-grid .btn{margin-top:12px}
.optrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.optrow input[type=radio]{accent-color:var(--red-2);width:20px;height:20px;flex:none}
.optrow .input{padding:10px 13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── النوافذ ── */
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(5,5,8,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fade .25s ease both}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:520px;max-height:min(90dvh,860px);display:flex;flex-direction:column;background:linear-gradient(135deg,rgba(40,40,48,.82),rgba(20,20,26,.86));animation:pop .3s cubic-bezier(.2,.9,.3,1.2) both}
.modal.wide{max-width:720px}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px}
.m-body{padding:6px 18px 12px;overflow-y:auto;overscroll-behavior:contain}
.m-foot{display:flex;gap:10px;justify-content:flex-start;padding:12px 18px 18px;flex-wrap:wrap}
.m-foot:empty{display:none}

.toasts{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(92vw,420px)}
.toast{padding:12px 18px;border-radius:14px;font-size:.92rem;font-weight:600;text-align:center;background:rgba(24,24,30,.9);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);animation:fadeUp .3s ease both;box-shadow:0 14px 34px -10px rgba(0,0,0,.7)}
.toast.ok{border-color:rgba(52,211,153,.5)}.toast.bad{border-color:rgba(248,113,113,.55)}

.foot{text-align:center;color:var(--faint);font-size:.78rem;margin-top:6px;letter-spacing:.3px}
.center-box{max-width:460px;margin:auto;text-align:center;padding:34px 24px}
.center-box .big{font-size:2.6rem;margin-bottom:6px}

/* ── جوال: جدول → بطاقات ── */
@media (max-width:760px){
  h1{font-size:1.35rem}.qtext{font-size:1.1rem}
  .tbl-wrap{padding:0;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  table,tbody,tr,td{display:block;width:100%}
  thead{display:none}

const CONFIG = {
  apiKey: "AIzaSyB-eVojK5FJfgisJywYehBvhBV8ut5Mqak",
  authDomain: "focusstudioquiz.firebaseapp.com",

  messagingSenderId: "616193962609",
  appId: "1:616193962609:web:a6f78fef98c9960940e1d0"
};
/* حساب الأدمن في Firebase Authentication: البريد مشتق من اسم المستخدم، وكلمة المرور = رقم الهاتف */
const ADMIN_EMAIL = 'manarfocus@focusquiz.app';
const SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';

let S = null, db = null, auth = null, admin = null;
const withTimeout = (p, ms, code = 'timeout') => Promise.race([p, new Promise((_, rj) => setTimeout(() => rj(Object.assign(new Error(code), { code })), ms))]);
const need = () => { if (!S) throw Object.assign(new Error('not-initialized'), { code: 'unavailable' }); };
const col = n => S.collection(db, n);
const ref = (n, id) => S.doc(db, n, id);
const clean = o => JSON.parse(JSON.stringify(o));          // يحذف undefined (Firestore لا يقبلها)

async function init() {
  if (S) return;
  let sdk = window.__FB_SDK__;                                // نقطة حقن للاختبار
  if (!sdk) {
    const [a, f, u] = await withTimeout(Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-firestore.js'), import(SDK + 'firebase-auth.js')]), 20000);
    sdk = Object.assign({}, a, f, u);
  }
  const app = sdk.initializeApp(CONFIG);
  // التحويل التلقائي إلى long-polling يساعد على الشبكات التي تحجب WebSocket
  db = sdk.initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
  auth = sdk.initializeAuth(app, { persistence: sdk.browserSessionPersistence });
  S = sdk;
  await withTimeout(new Promise(res => {
    let un = null, fired = false;
    un = S.onAuthStateChanged(auth, u => { admin = (u && u.email === ADMIN_EMAIL) ? u : null; if (!fired) { fired = true; res(); } });
  }), 8000).catch(() => {});
}

/* ── الأدمن ── */
async function adminSignIn(password) {
  need();
  const cred = await withTimeout(S.signInWithEmailAndPassword(auth, ADMIN_EMAIL, password), 15000);
  admin = cred.user; return true;
}
async function adminSignOut() { admin = null; if (S) { try { await S.signOut(auth); } catch (e) {} } }

/* ── الأسئلة ── */
async function questions() {
  need();
  const snap = await withTimeout(S.getDocs(col('questions')), 15000);
  const arr = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
  arr.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  arr.forEach(q => delete q.order);
  return arr.length ? arr : null;
}
async function runOps(ops) {
  for (let i = 0; i < ops.length; i += 400) {
    const b = S.writeBatch(db);
    ops.slice(i, i + 400).forEach(o => o[0] === 'set' ? b.set(ref(o[1], o[2]), o[3]) : b.delete(ref(o[1], o[2])));
    await withTimeout(b.commit(), 20000);
  }
}
async function saveQuestions(list) {
  need();
  const existing = (await S.getDocs(col('questions'))).docs.map(d => d.id), keep = new Set(list.map(q => q.id));
  const ops = list.map((q, i) => ['set', 'questions', q.id, Object.assign(clean(q), { order: i })]);
  existing.filter(id => !keep.has(id)).forEach(id => ops.push(['del', 'questions', id]));
  await runOps(ops);
}

/* ── منع إعادة الاختبار: وثيقة "taken" تُنشأ مرة واحدة فقط لكل (اسم + رقم) ── */
async function isTaken(id) { need(); return (await withTimeout(S.getDoc(ref('taken', id)), 15000)).exists(); }
async function markTaken(id, info) {
  need();
  if (await isTaken(id)) return 'exists';
  try { await withTimeout(S.setDoc(ref('taken', id), clean(info)), 15000); return 'ok'; }
  catch (e) { if (e.code === 'permission-denied' && await isTaken(id).catch(() => false)) return 'exists'; throw e; }
}
async function releaseTaken(id) { need(); await S.deleteDoc(ref('taken', id)); }
async function taken() { need(); return (await S.getDocs(col('taken'))).docs.map(d => Object.assign({}, d.data(), { id: d.id })); }

/* ── النتائج ── */
async function addResult(res) {
  need(); const { id, ...data } = res;
  try { await withTimeout(S.setDoc(ref('results', id), clean(data)), 20000); }
  catch (e) {                                                  // الرفض يعني غالباً أنها مسجّلة سابقاً (التحديث ممنوع على الطلاب) — نتأكد فعلاً من وجودها
    if (e.code === 'permission-denied') { const snap = await withTimeout(S.getDoc(ref('results', id)), 15000).catch(() => null); if (snap && snap.exists()) return; }
    throw e;
  }
}
async function results() { need(); return (await withTimeout(S.getDocs(col('results')), 20000)).docs.map(d => Object.assign({}, d.data(), { id: d.id })); }
async function updateResult(id, patch) { need(); await S.updateDoc(ref('results', id), clean(patch)); }
async function deleteResult(id) { need(); await runOps([['del', 'results', id], ['del', 'taken', id]]); }
async function clearResults() {
  need();
  const ids = new Set([...(await S.getDocs(col('results'))).docs.map(d => d.id), ...(await S.getDocs(col('taken'))).docs.map(d => d.id)]);
  const ops = []; ids.forEach(id => { ops.push(['del', 'results', id]); ops.push(['del', 'taken', id]); }); await runOps(ops);
}
async function importAll(d, hashFn) {
  need();
  await saveQuestions(d.questions);
  const ops = [];
  d.results.forEach(r => { const id = r.id || hashFn(r.key); const { id: _i, ...data } = r;
    ops.push(['set', 'results', id, clean(data)]); ops.push(['set', 'taken', id, { name: r.name, place: r.place, teacher: r.teacher, at: r.at }]); });
  await runOps(ops);
}

window.Backend = { init, adminSignIn, adminSignOut, adminUser: () => admin, ready: () => !!S,
  questions, saveQuestions, isTaken, markTaken, releaseTaken, taken, addResult, results, updateResult, deleteResult, clearResults, importAll };
})();

/* ═════════ إشعارات ونوافذ ═════════ */
function toast(msg, type = '') {
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => { t.style.opacity = 0; t.style.transition = 'opacity .4s'; setTimeout(() => t.remove(), 400); }, 3200);
}
function modal({ title, body, actions = [], wide = false, onMount }) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal glass${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="m-head"><h3>${esc(title)}</h3><button class="icon-btn" data-x type="button" aria-label="إغلاق">✕</button></div>
    <div class="m-body">${body}</div><div class="m-foot"></div></div>`;
  const close = () => { document.removeEventListener('keydown', onKey); ov.remove(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('submit', e => e.preventDefault());
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  $('[data-x]', ov).onclick = close;
  const foot = $('.m-foot', ov);
  actions.forEach(a => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ' + (a.cls || ''); b.textContent = a.label;
    b.onclick = () => { const r = a.onClick ? a.onClick(close, ov) : undefined; if (!a.keep && r !== false) close(); };
    foot.appendChild(b);
  });
  document.body.appendChild(ov);
  if (onMount) onMount(ov, close);
  const f = $('input,select,textarea', ov); if (f) setTimeout(() => f.focus(), 60);
  return { close, el: ov };
}
const confirmBox = (title, msg, okLabel = 'تأكيد', danger = false) => new Promise(res => {
  let done = false; const fin = v => { if (!done) { done = true; res(v); } };
  const m = modal({ title, body: `<p class="muted">${msg}</p>`, actions: [
    { label: okLabel, cls: danger ? 'danger' : 'primary', onClick: () => fin(true) },
    { label: 'إلغاء', onClick: () => fin(false) }] });
  new MutationObserver((_, o) => { if (!document.body.contains(m.el)) { fin(false); o.disconnect(); } }).observe(document.body, { childList: true });
});
const loaderHTML = msg => `<main class="wrap center fade-in">${brand()}<p class="tc muted">${msg}</p></main>`;

/* حفظ النتائج التي لم تصل للسيرفر (انقطاع اتصال) */
let flushing = false;
async function flushPending() {
  if (flushing || !B.ready()) return; flushing = true;
  try {
    for (const r of Local.pending()) {
      try { await B.addResult(r); } catch (e) { break; }          // تبقى في الطابور حتى يتأكد حفظها فعلاً
      Local.savePending(Local.pending().filter(x => x.id !== r.id));
    }
  } finally { flushing = false; }
}
window.addEventListener('online', flushPending);

/* ═════════ شاشة الدخول ═════════ */
const VIEWS = {};
VIEWS.login = () => {
  root.innerHTML = `<main class="wrap center fade-in">
    ${brand()}
    ${state.initError ? `<div class="glass card" style="padding:14px 18px;border-color:rgba(248,113,113,.5)"><p class="small" style="color:#ffb4b7">تعذّر الاتصال بقاعدة البيانات. تحقق من الإنترنت ثم <button class="link" data-a="reload">أعد المحاولة</button>.</p></div>` : ''}
    <section class="glass card">
      <h1>اختبار أساسيات التصوير</h1>
      <p class="muted">سجّل بياناتك للبدء</p>
      <form id="lf" novalidate autocomplete="off">
        <label class="field"><span>اسم المستخدم (المتدرب/ة)</span><input class="input" name="name" required autocomplete="off" placeholder="الاسم الكامل"></label>
        <label class="field"><span>رقم الهاتف (عليه واتساب)</span><input class="input ltr" name="phone" type="tel" inputmode="tel" required autocomplete="off" placeholder="09xxxxxxxx"></label>
        <label class="field"><span>مكان الكورس</span><input class="input" name="place" autocomplete="off" placeholder="مثال: معضمية الشام"></label>
        <label class="field"><span>أستاذ الكورس</span><input class="input" name="teacher" autocomplete="off" placeholder="اسم الأستاذ"></label>
        <div class="err" id="err" role="alert"></div>
        <button class="btn primary block" type="submit">متابعة</button>
      </form>
    </section>
    <button class="btn sm" id="installBtn" type="button" ${installEvt ? '' : 'hidden'} style="align-self:center">⤓ تثبيت التطبيق على جهازك</button>
    <p class="foot">Focus Studio · Marketing Agency</p>
  </main>`;
  root.onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target).entries()), btn = $('button[type=submit]', e.target);
    const name = (f.name || '').trim().replace(/\s+/g, ' '), phone = (f.phone || '').trim();
    const place = (f.place || '').trim(), teacher = (f.teacher || '').trim();
    const err = m => { $('#err').textContent = m; };
    const busy = on => { if (btn.isConnected) { btn.disabled = on; btn.textContent = on ? 'جارٍ التحقق…' : 'متابعة'; } };
    err('');
    if (!name || !phone) return err('يرجى إدخال الاسم ورقم الهاتف.');
    busy(true);
    try {
      if (adminName(name) === ADMIN_USER) {                       // دخول الأدمن عبر Firebase Authentication
        await B.adminSignIn(canonPhone(phone)); toast('أهلاً بك في لوحة الإدارة', 'ok'); return go('admin', { data: null });
      }
      if (name.length < 3) return err('الاسم قصير جداً.');
      const cp = canonPhone(phone);
      if (cp.length < 8 || cp.length > 15) return err('رقم الهاتف غير صالح.');
      if (!place) return err('يرجى إدخال مكان الكورس.');
      if (!teacher) return err('يرجى إدخال اسم أستاذ الكورس.');
      const key = identityKey(name, phone), id = hashKey(key), user = { name, phone, place, teacher, key, id };
      if (Local.done().includes(key)) return go('blocked', { user });
      const resuming = Local.attempts().some(a => a.key === key);
      if (!resuming && await B.isTaken(id)) return go('blocked', { user });
      state.bank = await loadBank();
      go('intro', { user });
    } catch (ex) { err(friendly(ex)); }
    finally { busy(false); }
  };
  root.onclick = async e => {
    if (e.target.closest('[data-a=reload]')) return location.reload();
    if (e.target.closest('#installBtn') && installEvt) { installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; $('#installBtn').hidden = true; }
  };
};

VIEWS.blocked = () => {
  root.innerHTML = `<main class="wrap center fade-in">${brand()}
    <section class="glass center-box"><div class="big">🔒</div><h1>تم تسجيل اختبارك مسبقاً</h1>
      <p class="muted" style="margin:10px 0 22px">لا يمكن إعادة الاختبار بنفس الاسم ورقم الهاتف.<br>إن كنت تعتقد أن هناك خطأً، تواصل مع مدرّب الكورس.</p>
      <button class="btn primary block" data-a="back">العودة</button></section></main>`;
  root.onclick = e => { if (e.target.closest('[data-a=back]')) go('login'); };
};

/* ═════════ المقدمة ═════════ */
VIEWS.intro = () => {
  const u = state.user, qs = state.bank || [];
  const att = Local.attempts().find(a => a.key === u.key);
  root.innerHTML = `<main class="wrap center fade-in">${brand()}
    <section class="glass card">
      <h1>أهلاً ${esc(u.name)} 👋</h1>
      <div class="who"><span class="pill">📍 ${esc(u.place)}</span><span class="pill">🎓 ${esc(u.teacher)}</span></div>
      <ul class="rules">
        <li><b>١</b><span>الاختبار من <strong>${qs.length}</strong> سؤالاً، مرتّبة من <strong>سهل</strong> إلى <strong>صعب جداً</strong>.</span></li>
        <li><b>٢</b><span>بعض الأسئلة اختيار من متعدد، وبعضها إجابتها <strong>كلمة أو كلمتان</strong>.</span></li>
        <li><b>٣</b><span>لا تظهر الإجابات الصحيحة إلا <strong>بعد إنهاء الاختبار</strong>.</span></li>
        <li><b>٤</b><span>لا يمكن <strong>إعادة الاختبار</strong> بنفس الاسم ورقم الهاتف.</span></li>
        <li><b>٥</b><span>تظهر علامتك <strong>بالنسبة المئوية</strong> مباشرة بعد الانتهاء.</span></li>
      </ul>
      ${qs.length ? `<div class="err" id="ierr"></div><button class="btn primary block" data-a="start">${att ? 'متابعة الاختبار' : 'ابدأ الاختبار'}</button>` : '<p class="err">لا توجد أسئلة حالياً. تواصل مع المدرّب.</p>'}
      <p class="tc" style="margin-top:14px"><button class="link" data-a="back">تعديل بياناتي</button></p>
    </section></main>`;
  root.onclick = async e => {
    const btn = e.target.closest('[data-a]'), a = btn?.dataset.a;
    if (a === 'back') go('login');
    if (a === 'start') {
      btn.disabled = true; const label = btn.textContent; btn.textContent = 'جارٍ التحضير…';
      try {
        const attempts = Local.attempts(); let at = attempts.find(x => x.key === u.key);
        if (!at) {
          const r = await B.markTaken(u.id, { name: u.name, place: u.place, teacher: u.teacher, at: Date.now() });   // وثيقة لا تُنشأ إلا مرة واحدة
          if (r === 'exists') return go('blocked');
          at = { id: uid(), key: u.key, name: u.name, phone: u.phone, place: u.place, teacher: u.teacher, startedAt: Date.now(), cur: 0, answers: {},
            order: [1, 2, 3, 4].flatMap(l => shuffle(qs.filter(q => q.level === l))).map(q => ({ qid: q.id, opt: q.type === 'mcq' ? shuffle(q.options.map((_, i) => i)) : null })) };
          attempts.push(at); Local.saveAttempts(attempts);
        }
        go('exam', { attempt: at });
      } catch (ex) { toast(friendly(ex), 'bad'); if (btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
    }
  };
};

/* ═════════ الاختبار ═════════ */
function saveAttempt() {
  const list = Local.attempts(), i = list.findIndex(a => a.id === state.attempt.id);
  if (i >= 0) list[i] = state.attempt; else list.push(state.attempt);
  Local.saveAttempts(list);
}
VIEWS.exam = () => {
  const at = state.attempt, bank = Object.fromEntries((state.bank || []).map(q => [q.id, q]));
  at.order = at.order.filter(o => bank[o.qid]);                    // تجاهل الأسئلة المحذوفة
  if (!at.order.length) { toast('لا توجد أسئلة متاحة', 'bad'); return go('login'); }
  at.cur = Math.min(Math.max(at.cur || 0, 0), at.order.length - 1);
  window.onbeforeunload = e => { e.preventDefault(); e.returnValue = ''; return ''; };

  let firstDraw = true, lastQ = null;
  const draw = () => {
    const total = at.order.length, o = at.order[at.cur], q = bank[o.qid];
    const ans = at.answers[q.id], answered = i => { const v = at.answers[at.order[i].qid]; return v !== undefined && String(v).trim() !== ''; };
    const doneCount = at.order.filter((_, i) => answered(i)).length;
    const last = at.cur === total - 1;

          : `<input class="input" id="sa" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="اكتب إجابتك هنا" value="${esc(ans ?? '')}" maxlength="60"><p class="hint">اكتب كلمة أو كلمتين فقط.</p>`}
      </section>
      <div class="navbtns">
        <button class="btn" data-nav="-1" ${at.cur === 0 ? 'disabled' : ''}>→ السابق</button>
        ${last ? `<button class="btn primary" data-fin>إنهاء الاختبار ✓</button>` : `<button class="btn primary" data-nav="1">التالي ←</button>`}
      </div></main>`;
    firstDraw = false; lastQ = q.id;
    const cur = $('.dot-b.cur'); if (cur) cur.scrollIntoView({ inline: 'center', block: 'nearest' });
    if (q.type === 'short') { const el = $('#sa'); setTimeout(() => el && el.focus({ preventScroll: true }), 50); }
  };
  const move = d => { at.cur = Math.min(Math.max(at.cur + d, 0), at.order.length - 1); saveAttempt(); draw(); window.scrollTo(0, 0); };
  const finish = () => {
    const unanswered = at.order.filter(o => { const v = at.answers[o.qid]; return v === undefined || String(v).trim() === ''; }).length;
    modal({ title: 'إنهاء الاختبار؟',
      body: `<p class="muted">${unanswered ? `لديك <strong style="color:#fff">${unanswered}</strong> سؤال بدون إجابة. ` : ''}بعد الإنهاء لن تتمكن من تعديل إجاباتك ولا من إعادة الاختبار.</p>`,
      actions: [{ label: 'إنهاء وعرض النتيجة', cls: 'primary', onClick: () => submit() }, { label: 'مراجعة إجاباتي' }] });
  };
  const submit = () => {
    const res = grade(at, bank);
    Local.addDone(at.key);
    Local.saveAttempts(Local.attempts().filter(a => a.id !== at.id));
    Local.savePending(Local.pending().filter(x => x.id !== res.id).concat([res]));   // يبقى في الطابور حتى يتأكد الحفظ
    window.onbeforeunload = null; go('result', { result: res });
    flushPending().then(() => { const el = $('#sync'); if (!el) return;
      const unsaved = Local.pending().some(x => x.id === res.id);
      el.textContent = unsaved ? '⚠️ لم تُسجَّل نتيجتك بعد بسبب ضعف الاتصال. أبقِ هذه الصفحة مفتوحة وسيتم تسجيلها تلقائياً.' : '✓ تم تسجيل نتيجتك لدى المدرّب';
      el.style.color = unsaved ? '#fcd34d' : '#86efac'; });
  };
  root.onclick = e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.pick !== undefined) { at.answers[at.order[at.cur].qid] = +t.dataset.pick; saveAttempt(); draw(); }
    else if (t.dataset.nav) move(+t.dataset.nav);
    else if (t.dataset.go !== undefined) { at.cur = +t.dataset.go; saveAttempt(); draw(); }
    else if (t.hasAttribute('data-fin')) finish();
  };
  root.oninput = e => {
    if (e.target.id !== 'sa') return;
    at.answers[at.order[at.cur].qid] = e.target.value; saveAttempt();
    const has = e.target.value.trim() !== '', d = $('.dot-b.cur'); if (d) d.classList.toggle('done', has);
  };
  root.onkeydown = e => { if (e.key === 'Enter' && e.target.id === 'sa') { e.preventDefault(); at.cur < at.order.length - 1 ? move(1) : finish(); } };
  draw();
};

/* ═════════ التصحيح ═════════ */
function checkAnswer(q, given) {
  if (given === undefined || given === null || String(given).trim() === '') return false;
  if (q.type === 'mcq') return Number(given) === Number(q.correct);
  const g = normAnswer(given); return !!g && (q.answers || []).some(a => normAnswer(a) === g);
}
const correctText = q => q.type === 'mcq' ? q.options[q.correct] : (q.answers || [])[0] || '';
function grade(at, bank) {
  const details = at.order.map(o => {
    const q = bank[o.qid], g = at.answers[q.id], ok = checkAnswer(q, g);
    return { qid: q.id, level: q.level, type: q.type, text: q.text, given: (g === undefined || String(g).trim() === '') ? '' : (q.type === 'mcq' ? q.options[g] : String(g).trim()), correctText: correctText(q), ok, explain: q.explain || '' };
  });
  const correct = details.filter(d => d.ok).length, total = details.length, percent = round1((correct / total) * 100);
  return { id: hashKey(at.key), key: at.key, name: at.name, phone: at.phone, place: at.place, teacher: at.teacher, correct, total, percent, grade: gradeOf(percent).name, at: Date.now(), details };
}

function exportCSV(rows) {

  const lines = [head.map(cell).join(',')].concat(rows.map(r => [cell(r.name), cell('="' + r.phone + '"'), cell(r.place), cell(r.teacher), cell(r.correct), cell(r.total), cell(r.percent), cell(gradeOf(r.percent).name), cell(fmtDate(r.at))].join(',')));
  download('focus-participants.csv', '﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8');
}
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

      <button class="btn primary sm" data-new>＋ إضافة سؤال</button></div>
    ${state.data.qsFromDb ? '' : '<p class="small" style="color:#fcd34d;margin-bottom:10px">الأسئلة المعروضة افتراضية وغير محفوظة بعد في قاعدة البيانات. أول تعديل أو إضافة سيحفظها للجميع.</p>'}
    <div class="chips" style="margin-bottom:14px">${[[0, 'الكل (' + all.length + ')'], ...[1, 2, 3, 4].map(l => [l, `${LEVELS[l]} (${all.filter(q => q.level === l).length})`])].map(([l, t]) => `<button class="chip ${lvl === l ? 'on' : ''}" data-lvl="${l}">${t}</button>`).join('')}</div>
    <div class="qlist">${list.length ? list.map(({ q, i }) => `<article class="glass qrow">
      <div class="qrow-h"><div class="tags"><span class="pill lvl-${q.level}">${LEVELS[q.level]}</span><span class="pill">${q.type === 'mcq' ? 'اختيار من متعدد' : 'إجابة قصيرة'}</span><span class="faint small">#${i + 1}</span></div>
        <div class="acts"><button class="icon-btn" data-qe="${i}" title="تعديل">✎</button><button class="icon-btn" data-qd="${i}" title="حذف">🗑</button></div></div>
      <div class="qt">${esc(q.text)}</div>
      <div class="ans">✔ ${q.type === 'mcq' ? esc(q.options[q.correct]) : esc((q.answers || []).join(' ، '))}</div></article>`).join('') : '<div class="glass empty">لا توجد أسئلة مطابقة.</div>'}</div>`;
  $('#qsrch').oninput = e => { state.filters.qq = e.target.value; const pos = e.target.selectionStart; drawQuestions(panel); const n = $('#qsrch'); n.focus(); n.setSelectionRange(pos, pos); };
  panel.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.lvl !== undefined) { state.filters.lvl = +b.dataset.lvl; return drawQuestions(panel); }
    if (b.hasAttribute('data-new')) return editQuestion(null);
    if (b.dataset.qe !== undefined) return editQuestion(+b.dataset.qe);
    if (b.dataset.qd !== undefined) {
      const i = +b.dataset.qd, q = all[i];
      if (await confirmBox('حذف السؤال؟', `<strong style="color:#fff">${esc(q.text)}</strong>`, 'حذف', true)) { const next = all.slice(); next.splice(i, 1); persistQuestions(next, 'تم حذف السؤال'); }
    }
  };
}
function editQuestion(idx) {
  const all = clone(state.data.qs), isNew = idx === null;
  const q = isNew ? { id: 'u' + uid(), level: 1, type: 'mcq', text: '', options: ['', '', '', ''], correct: 0, answers: [], explain: '' } : clone(all[idx]);
  if (!q.options || q.options.length < 4) q.options = [...(q.options || []), '', '', '', ''].slice(0, 4);
  const optsHTML = () => q.options.map((o, i) => `<div class="optrow"><input type="radio" name="cor" value="${i}" ${q.correct === i ? 'checked' : ''} title="الإجابة الصحيحة"><input class="input" name="o${i}" placeholder="الخيار ${LETTERS[i]}" value="${esc(o)}"></div>`).join('');
  modal({ title: isNew ? 'إضافة سؤال' : 'تعديل السؤال', wide: true,
    body: `<form id="qf">
      <div class="two"><label class="field"><span>المستوى</span><select class="select" name="level">${[1, 2, 3, 4].map(l => `<option value="${l}" ${q.level === l ? 'selected' : ''}>${LEVELS[l]}</option>`).join('')}</select></label>
      <label class="field"><span>نوع السؤال</span><select class="select" name="type"><option value="mcq" ${q.type === 'mcq' ? 'selected' : ''}>اختيار من متعدد</option><option value="short" ${q.type === 'short' ? 'selected' : ''}>إجابة بكلمة أو كلمتين</option></select></label></div>
      <label class="field"><span>نص السؤال</span><textarea class="textarea" name="text">${esc(q.text)}</textarea></label>
      <div id="mcqbox" ${q.type === 'mcq' ? '' : 'hidden'}><span class="small muted" style="display:block;margin-bottom:6px">الخيارات — حدّد الدائرة بجانب الإجابة الصحيحة</span>${optsHTML()}</div>
      <div id="shortbox" ${q.type === 'short' ? '' : 'hidden'}><label class="field"><span>الإجابات المقبولة (افصل بينها بفاصلة أو سطر جديد — الأولى تُعرض كإجابة صحيحة)</span><textarea class="textarea" name="answers">${esc((q.answers || []).join('\n'))}</textarea></label></div>
      <label class="field"><span>توضيح يظهر بعد الاختبار (اختياري)</span><textarea class="textarea" name="explain" style="min-height:64px">${esc(q.explain || '')}</textarea></label>
      <div class="err" id="qerr"></div></form>`,
    onMount: ov => { const t = $('[name=type]', ov); t.onchange = () => { $('#mcqbox', ov).hidden = t.value !== 'mcq'; $('#shortbox', ov).hidden = t.value !== 'short'; }; },
    actions: [{ label: 'حفظ', cls: 'primary', onClick: () => {
      const f = new FormData($('#qf')), err = m => { $('#qerr').textContent = m; return false; };
      const type = f.get('type'), text = (f.get('text') || '').trim();
      if (text.length < 5) return err('اكتب نص السؤال.');
      const nq = { id: q.id, level: +f.get('level'), type, text, explain: (f.get('explain') || '').trim() };
      if (type === 'mcq') {
        nq.options = [0, 1, 2, 3].map(i => (f.get('o' + i) || '').trim());
        if (nq.options.some(o => !o)) return err('أكمل الخيارات الأربعة.');
        if (new Set(nq.options.map(normAr)).size < 4) return err('الخيارات يجب أن تكون مختلفة.');
        nq.correct = +(f.get('cor') ?? 0);
      } else {
        nq.answers = (f.get('answers') || '').split(/[\n,،]+/).map(s => s.trim()).filter(Boolean);
        if (!nq.answers.length) return err('أدخل إجابة مقبولة واحدة على الأقل.');
      }
      if (isNew) all.push(nq); else all[idx] = nq;
      persistQuestions(all, isNew ? 'تمت إضافة السؤال' : 'تم حفظ السؤال');
    } }, { label: 'إلغاء' }] });
}

/* ── الإعدادات والنسخ الاحتياطي ── */
function drawSettings(panel) {
  panel.innerHTML = `<div class="set-grid">
    <div class="glass card"><h3>نسخة احتياطية</h3><p class="muted small">تصدير الأسئلة والنتائج في ملف واحد (JSON) للاحتفاظ به.</p><button class="btn" id="bk">⤓ تنزيل نسخة احتياطية</button></div>
    <div class="glass card"><h3>استيراد نسخة</h3><p class="muted small">استعادة الأسئلة والنتائج من ملف نسخة احتياطية. سيستبدل الأسئلة الحالية ويضيف النتائج.</p><input type="file" id="imp" accept="application/json,.json" hidden><button class="btn" id="impb">⤒ اختيار ملف</button></div>
    <div class="glass card"><h3>استعادة الأسئلة الافتراضية</h3><p class="muted small">إعادة بنك الأسئلة إلى الأسئلة الأصلية (40 سؤالاً). النتائج لا تتأثر.</p><button class="btn danger" id="rq">↺ استعادة الأسئلة</button></div>
    <div class="glass card"><h3>حذف كل النتائج</h3><p class="muted small">يمسح جميع المتدربين المشاركين ويسمح للجميع بإعادة الاختبار.</p><button class="btn danger" id="ra">🗑 حذف كل النتائج</button></div>
  </div>
  <p class="faint small tc" style="margin-top:18px">البيانات محفوظة سحابياً (Firebase) وتظهر لك من أي جهاز.</p>`;
  $('#bk').onclick = () => download('focus-quiz-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({ app: 'focus-quiz', v: 2, questions: state.data.qs, results: state.data.results }, null, 2), 'application/json');
  $('#impb').onclick = () => $('#imp').click();
  $('#imp').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const d = JSON.parse(await file.text());
      if (d.app !== 'focus-quiz' || !Array.isArray(d.questions) || !Array.isArray(d.results)) throw 0;
      if (!await confirmBox('استيراد النسخة؟', 'ستُستبدل الأسئلة الحالية بمحتوى الملف، وتُضاف نتائجه.', 'استيراد', true)) return;
      await B.importAll(d, hashKey); toast('تم الاستيراد بنجاح', 'ok'); await reloadAdmin();
    } catch (err) { toast(err ? friendly(err) : 'الملف غير صالح', 'bad'); }
  };
  $('#rq').onclick = async () => { if (await confirmBox('استعادة الأسئلة؟', 'ستُستبدل أسئلتك الحالية بالأسئلة الافتراضية الأربعين.', 'استعادة', true)) persistQuestions(clone(window.DEFAULT_QUESTIONS), 'تمت الاستعادة'); };
  $('#ra').onclick = async () => { if (await confirmBox('حذف كل النتائج؟', 'لا يمكن التراجع عن هذا الإجراء.', 'حذف الكل', true)) { try { await B.clearResults(); toast('تم حذف النتائج', 'ok'); await reloadAdmin(); } catch (ex) { adminFail(ex); } } };
}

/* ═════════ البدء ═════════ */
(async function boot() {
  startSplash();
  try { await B.init(); if (B.adminUser()) state.view = 'admin'; flushPending(); }
  catch (ex) { state.initError = ex; console.warn('Backend init failed', ex); }
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
})();

</script>
</body>
</html>
